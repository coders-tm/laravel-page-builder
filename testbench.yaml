laravel: "@testbench"

providers:
  - Qirolab\Theme\ThemeServiceProvider
  - PageBuilder\Providers\PageBuilderServiceProvider
  - Workbench\App\Providers\WorkbenchServiceProvider

migrations:
  - workbench/database/migrations

seeders:
  - Workbench\Database\Seeders\DatabaseSeeder

workbench:
  start: "/"
  install: true
  health: false
  discovers:
    web: true
    api: true
    commands: true
    components: false
    factories: true
  build:
    - sync-skeleton
    - asset-publish
    - pagebuilder:install
    - workbench:setup-theme
    - create-sqlite-db
    - db-wipe
    - migrate-fresh
    - storage:link
  assets:
    - laravel-assets
  sync:
    - from: storage
      to: workbench/storage
      reverse: true

env:
  - APP_NAME="My App"
  - CACHE_STORE=array
  - CACHE_DRIVER=array
  - SESSION_DRIVER=file
